<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t">
  <title id="t">Orange toy track crossing a bedroom with giant toy blocks, a race car number 07 and a fire hoop</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9D8F5"/><stop offset="1" stop-color="#D3EEFB"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7821A"/><stop offset="1" stop-color="#FF8A1F"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6EC6FF"/><stop offset="1" stop-color="#CFF0FF"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#wall)"/>
  <!-- Window and curtains -->
  <g stroke="#141414" stroke-width="4" stroke-linejoin="round">
    <rect x="420" y="26" width="150" height="104" rx="4" fill="url(#sky)"/>
    <circle cx="530" cy="58" r="14" fill="#FFE36B"/>
    <path d="M492 26v104M420 78h150" stroke="#FFFFFF" stroke-width="7"/>
    <rect x="420" y="26" width="150" height="104" rx="4" fill="none"/>
    <path d="M398 18h28l-4 124h-20zM564 18h28l-4 124h-20z" fill="#E85D75"/>
  </g>
  <!-- Bed, books and giant toy blocks -->
  <g stroke="#141414" stroke-width="4" stroke-linejoin="round">
    <rect x="18" y="96" width="16" height="96" rx="4" fill="#C98B4F"/>
    <rect x="28" y="140" width="190" height="24" rx="8" fill="#FFFFFF"/>
    <rect x="80" y="130" width="140" height="36" rx="8" fill="#4F7CE0"/>
    <rect x="28" y="162" width="196" height="18" rx="3" fill="#C98B4F"/>
    <rect x="236" y="166" width="80" height="20" rx="3" fill="#E85D75"/>
    <rect x="242" y="148" width="70" height="18" rx="3" fill="#F2C14E"/>
    <rect x="236" y="132" width="76" height="16" rx="3" fill="#4F7CE0"/>
    <rect x="452" y="134" width="56" height="56" rx="6" fill="#E85D75"/>
    <rect x="512" y="134" width="56" height="56" rx="6" fill="#4F7CE0"/>
    <rect x="482" y="78" width="56" height="56" rx="6" fill="#F2C14E"/>
  </g>
  <g fill="#FFF3E3" stroke="#141414" stroke-width="3" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="34" text-anchor="middle" paint-order="stroke">
    <text x="480" y="174">A</text><text x="540" y="174">B</text><text x="510" y="118">C</text>
  </g>
  <rect y="186" width="640" height="10" fill="#FFFFFF"/>
  <!-- Wood floor and a blue rug -->
  <rect y="194" width="640" height="206" fill="#D9A066"/>
  <g fill="#A8703E"><path d="M120 194h3L-60 400h-6zM518 194h3l184 206h-6z"/></g>
  <path d="M250 194h140l300 206H-50z" fill="#3F73D8"/>
  <path d="M250 194h6L-34 400h-16zM384 194h6l300 206h-16z" fill="#FFF3E3"/>
  <!-- Orange plastic track with rails, grooves and joints -->
  <path d="M288 194h64l238 206H50z" fill="#E87010"/>
  <path d="M294 194h52l214 206H80z" fill="url(#road)"/>
  <g fill="#D9660A"><path d="M311 194h3l-41 206h-9zM326 194h3l47 206h-9z"/></g>
  <g fill="#A84800"><path d="M300 204h40l1 3h-42zM283 232h74l2 5h-78zM253 280h134l4 8H249zM196 366h248l7 14H189z"/></g>
  <!-- Fire hoop -->
  <g transform="translate(320 190)">
    <circle r="52" fill="none" stroke="#FF6A00" stroke-width="20" stroke-dasharray="10 6"/>
    <circle r="46" fill="none" stroke="#FFD23F" stroke-width="8" stroke-dasharray="6 8"/>
    <circle r="40" fill="none" stroke="#141414" stroke-width="7"/>
    <circle r="40" fill="none" stroke="#8A8F99" stroke-width="3"/>
  </g>
  <!-- Race car number 07, rear view -->
  <g stroke="#141414" stroke-width="5" stroke-linejoin="round">
    <rect x="220" y="320" width="44" height="64" rx="10" fill="#1E1E22"/>
    <rect x="376" y="320" width="44" height="64" rx="10" fill="#1E1E22"/>
    <path d="M226 368h188l4-34-20-22H242l-20 22z" fill="#DD0200"/>
    <path d="M286 312l10-22h48l10 22z" fill="#A30100"/>
    <path d="M292 310l7-16h42l7 16z" fill="#1B2350"/>
    <rect x="248" y="318" width="144" height="8" rx="4" fill="#FF2A2A"/>
    <path d="M300 300v-30M340 300v-30" stroke-width="7"/>
    <rect x="226" y="258" width="188" height="16" rx="6" fill="#A30100"/>
    <rect x="218" y="250" width="14" height="30" rx="4" fill="#DD0200"/>
    <rect x="408" y="250" width="14" height="30" rx="4" fill="#DD0200"/>
    <circle cx="320" cy="344" r="15" fill="#FFFFFF" stroke-width="3"/>
  </g>
  <path d="M232 263h176" stroke="#FFFFFF" stroke-width="4"/>
  <text x="320" y="351" fill="#141414" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="17" text-anchor="middle">07</text>
  <!-- Nitro bolt and coins -->
  <g transform="translate(140 64) rotate(-10)" stroke="#141414" stroke-width="5" stroke-linejoin="round">
    <circle r="34" fill="#1F4BFF"/>
    <path d="M5-22-14 4h12l-7 20 22-27H1l9-19z" fill="#FFCC00"/>
  </g>
  <g transform="translate(220 52)" stroke="#141414" stroke-width="4"><circle r="16" fill="#FFCC00"/><circle r="7" fill="none"/></g>
</svg>
